name: Update Wordlist

on:
  schedule:
    # 毎月1日の UTC 0:00 (日本時間 9:00) に実行
    - cron: '0 0 1 * *'
  workflow_dispatch: # 手動実行もできるようにする

permissions:
  contents: write # 更新したファイルをコミットするために必要

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install "wordfreq[cjk]"

      - name: Download WordNet XML
        run: |
          # 日本語WordNetのXMLは大きいので、リポジトリには含めず都度取得する
          # -f: 取得に失敗したらここで止める(壊れたファイルのまま続行しない)
          curl -fL --retry 3 -o wnja-2.1.xml https://github.com/bond-lab/wnja/releases/download/v2.1/wnja-2.1.xml

      - name: Generate wordlist and update index.html
        run: |
          # 単語リストを作り、index.html の DEFAULT_WORDS と、
          # クレジット画面のJMdictの版・語数も書き換える。
          # 語数が極端に少ない・大きく減るときは、何も書き換えずに失敗する。
          python build_wordlist.py --wordnet-xml wnja-2.1.xml --download --out out --update-html index.html

      - name: Commit and push if changed
        run: |
          # クレジット(NOTICE.txt)と、使ったJMdictの版・語数(build_report.txt)も保存する
          cp out/NOTICE.txt out/build_report.txt .
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html NOTICE.txt build_report.txt
          if git diff --staged --quiet; then
            echo "変更なし"
          else
            git commit -m "Auto-update wordlist from latest JMdict" -m "$(head -n 1 build_report.txt)"
            git push
          fi
