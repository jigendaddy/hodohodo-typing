name: Update Wordlist

on:
  schedule:
    # 毎月1日の UTC 0:00 (日本時間 9:00) に実行
    - cron: '0 0 1 * *'
  workflow_dispatch: # 手動実行もできるようにする

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install "wordfreq[cjk]"

      - name: Download WordNet XML
        run: |
          # 日本語WordNetのXMLをダウンロード（サイズが大きいためリポジトリには含めず都度取得）
          curl -L -o wnja-2.1.xml https://github.com/bond-lab/wnja/releases/download/v2.1/wnja-2.1.xml

      - name: Generate Wordlist
        run: |
          # XMLから単語リストを生成し、out/ フォルダに出力
          python build_wordlist.py --wordnet-xml wnja-2.1.xml --download

      - name: Update HTML DEFAULT_WORDS
        run: |
          # 生成された words_for_game.txt を読み込み、HTML内の DEFAULT_WORDS を書き換えるPythonスクリプト
          python -c "
          import re, json
          with open('out/words_for_game.txt', encoding='utf-8') as f:
              lines = f.read().strip().split('\n')
          words_json = json.dumps(lines, ensure_ascii=False)
          
          with open('hodohodo-typing.html', encoding='utf-8') as f:
              html = f.read()
              
          # HTML内の const DEFAULT_WORDS = [ ... ]; を正規表現で置換
          new_html = re.sub(
              r'const DEFAULT_WORDS = \[.*?\];',
              f'const DEFAULT_WORDS = {words_json};',
              html,
              flags=re.DOTALL
          )
          
          with open('hodohodo-typing.html', 'w', encoding='utf-8') as f:
              f.write(new_html)
          "

      - name: Commit and push if changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # 変更されたHTMLだけを追加する（NOTICE.txtはまだないので外す）
          git add hodohodo-typing.html
          # 変更があればコミットしてプッシュ
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update wordlist from latest JMdict" && git push)
